services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-portfolio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-portfolio}
      POSTGRES_DB: ${DB_NAME:-portfolio}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-portfolio} -d ${DB_NAME:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO's own images were withdrawn when the open-source project was archived.
    # Root keeps existing volumes readable; the service is not public in production.
    image: cgr.dev/chainguard/minio:latest
    user: root
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - miniodata:/data

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_PORT: "9998"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-portfolio}
      DB_PASSWORD: ${DB_PASSWORD:-portfolio}
      DB_NAME: ${DB_NAME:-portfolio}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_TTL: ${JWT_TTL:-24h}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin123}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-portfolio}
      S3_USE_SSL: "false"
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:${MINIO_PORT:-9010}/portfolio}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:9999,http://localhost:5173}
    ports:
      - "9998:9998"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      secrets:
        - frontend_env
    restart: unless-stopped
    ports:
      - "9999:80"
    depends_on:
      - backend
      - minio

secrets:
  # Copy frontend/.env.example to frontend/.env before building.
  frontend_env:
    file: ./frontend/.env

volumes:
  pgdata:
  miniodata: